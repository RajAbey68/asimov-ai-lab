          "name": "What is the ASIMOV Audit?",

            "@type": "Answer",
            "text": "A fixed-scope, six-week audit covering six governance domains. You get a board-ready compliance dashboard, a remediation roadmap, and a signed partner report. We do not consult on what the verdict should be — we tell you what it is."
          }
        },
        {
          "@type": "Question",
          "name": "How much does an audit cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fixed-fee pricing — no hourly surprises. The advisory retainer is £3,500 per month. Audit pricing varies by scope and firm size. Contact advisory@asimov-ai.org for a quote."
          }
        },
        {
          "@type": "Question",
          "name": "Who signs the audit report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dr Nick Lockett — barrister, solicitor, founder of CAAIRO — reviews and countersigns every ASIMOV Audit report. A named professional with personal accountability, not an algorithm or junior associate."
          }
        },
        {
          "@type": "Question",
          "name": "What is post-quantum cryptography?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Post-quantum cryptography (PQC) replaces today's public-key algorithms with ones resistant to quantum attacks. NIST finalised the first three PQC standards in August 2024. Organisations handling long-lived confidential data (legal, financial, health) face a 2035 migration deadline. ASIMOV PQC Hub advises firms on readiness, vendor claims, and migration planning."
          }
        },
        {
          "@type": "Question",
          "name": "Do you build AI systems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. ASIMOV AI audits and governs AI risk. We do not build AI systems, nor do we sell AI tooling. We are independent — our audit verdict is not influenced by any vendor, platform, or AI Integ engagement."
          }
        }
